name: Verify teaching
on:
  workflow_call:
  pull_request:
  push:
    branches: ['teaching-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAB_TOOLS: ${{ github.workspace }}/.lab-tools
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install tools
        run: |
          pip install -q -r requirements.txt fsrs==6.3.2 pytest ruff numpy scipy pandas scikit-learn
          sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm gcc make gdb valgrind
          sudo sysctl -q vm.mmap_rnd_bits=28
          scripts/fetch_lab_tools.sh "$LAB_TOOLS"
          npm install --no-save --silent playwright-core@1.62.1 axe-core@4.10.3
          npx playwright-core install --with-deps chromium
      - name: Study data is consistent
        run: python3 scripts/validate_study.py
      - name: Pages, links and courses are consistent
        run: python3 scripts/validate.py
      - name: Chinese chapters carry the full English text
        run: python3 scripts/zh_depth.py check
      - name: Every program compiles, runs and prints what the page says
        run: python3 scripts/verify_examples.py
      - name: Every practice answer and guide example is right
        run: |
          python3 scripts/verify_practice.py
          python3 scripts/verify_bridges.py
      - name: Every lab runs with its real tools
        run: python3 scripts/verify_labs.py --write
      - name: Save what the labs printed
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lab-captures
          path: content/labs/*/captured.json
          if-no-files-found: ignore
      - name: Review scheduler matches the reference
        run: python3 scripts/verify_fsrs.py
      - name: Run buttons work in a real browser
        run: node scripts/verify_browser_runners.mjs
      - name: Failed runs are explained correctly
        run: node scripts/test_explain.mjs
      - name: Learning features work at desktop and phone width
        run: node scripts/test_study.mjs
      - name: Four readers walk their tasks at desktop and phone width, in both themes
        run: WALK_SHOTS=walk/shots WALK_REPORT=walk/report.json node scripts/learner_walk.mjs
      - name: Save the walk's screenshots and timings
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: learner-walk
          path: walk/
          if-no-files-found: ignore
