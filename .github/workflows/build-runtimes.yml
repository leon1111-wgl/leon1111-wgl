name: Build the browser compilers
# Reproduces site/assets/runner/c and java from pinned upstream commits. Download the artifact, then run
# scripts/build_browser_c.py and scripts/build_browser_java.py on it and commit the result.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build xcc's wcc
        run: |
          git clone https://github.com/tyfkda/xcc xcc
          cd xcc
          git checkout d7bb34e
          sudo apt-get update -qq && sudo apt-get install -y -qq llvm
          sudo ln -sf "$(ls /usr/bin/llvm-ar* | sort | tail -1)" /usr/local/bin/llvm-ar
          npm ci --silent
          make -j4 wcc
          make -j4 wcc-gen2
          make assets
      - name: Build teavm-javac
        run: |
          git clone https://github.com/konsoletyper/teavm-javac tv
          cd tv
          git checkout 76b5b53850f74e510ec8588a56a211cf60e9d496
          ./gradlew --no-daemon :ui:war -x check
          mkdir -p ../java && cd ../java && unzip -q ../tv/ui/build/libs/*.war
      - uses: actions/upload-artifact@v5
        with:
          name: browser-compilers
          path: |
            xcc/public/wccfiles.zip
            xcc/LICENSE
            java/compiler.wasm
            java/compiler.wasm-runtime.js
            java/compile-classlib-teavm.bin
            java/runtime-classlib-teavm.bin
