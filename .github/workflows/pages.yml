name: Publish Leon Learning
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-python:
    uses: ./.github/workflows/python-course.yml
    permissions:
      contents: read
  verify-teaching:
    uses: ./.github/workflows/verify-teaching.yml
    permissions:
      contents: read
  deploy:
    needs: [verify-python, verify-teaching]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check search and sharing tags
        run: python3 scripts/validate_seo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
