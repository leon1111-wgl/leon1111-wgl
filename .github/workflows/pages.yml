name: Publish Leon Learning
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-python:
    uses: ./.github/workflows/python-course.yml
    permissions:
      contents: read
  verify-teaching:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install tools
        run: |
          pip install -q -r requirements.txt fsrs==6.3.2
          sudo apt-get update -qq && sudo apt-get install -y -qq clang
          npm install --no-save --silent playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
      - name: Study data is consistent
        run: python3 scripts/validate_study.py
      - name: Every program compiles, runs and prints what the page says
        run: python3 scripts/verify_examples.py
      - name: Review scheduler matches the reference
        run: python3 scripts/verify_fsrs.py
      - name: Run buttons work in a real browser
        run: node scripts/verify_browser_runners.mjs
      - name: Learning features work at desktop and phone width
        run: node scripts/test_study.mjs
  deploy:
    needs: [verify-python, verify-teaching]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check search and sharing tags
        run: python3 scripts/validate_seo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
