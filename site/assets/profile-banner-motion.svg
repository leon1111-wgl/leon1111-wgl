<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="t">
<title id="t">Leon Wang — spatial intelligence, multimodal long-video understanding and grounding, embodied AI, enterprise AI agents</title>
<style>
  .name { font: 700 64px Arial, Helvetica, sans-serif; fill: #f2f6fb; letter-spacing: -2px; }
  .label { font: 700 13px Arial, Helvetica, sans-serif; fill: #60c9ce; letter-spacing: 3px; }
  .area { font: 400 26px Arial, Helvetica, sans-serif; fill: #b8ee91; opacity: 0; animation: cycle 12s infinite; }
  .a2 { animation-delay: 3s; } .a3 { animation-delay: 6s; } .a4 { animation-delay: 9s; }
  @keyframes cycle {
    0% { opacity: 0; transform: translateY(10px); }
    4%, 22% { opacity: 1; transform: translateY(0); }
    27%, 100% { opacity: 0; transform: translateY(-10px); }
  }
  .link { font: 400 14px Arial, Helvetica, sans-serif; fill: #8aa0b4; letter-spacing: .5px; }
  .spin { transform-origin: 665px 159px; animation: spin 28s linear infinite; }
  .spin-rev { transform-origin: 665px 159px; animation: spin 46s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pulse { transform-origin: 665px 159px; animation: pulse 3.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: .8; transform: scale(1.1); } }
  .frame { fill: #142130; stroke: #2a3b4b; }
  @media (prefers-reduced-motion: reduce) {
    .area, .spin, .spin-rev, .pulse { animation: none; }
    .a1 { opacity: 1; }
  }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d2b3a" stroke-width=".7"/></pattern>
  <radialGradient id="glow"><stop stop-color="#60c9ce" stop-opacity=".18"/><stop offset="1" stop-color="#0b111c" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="840" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="840" height="320" fill="#0b111c"/>
  <rect width="840" height="320" fill="url(#grid)"/>
  <ellipse cx="665" cy="159" rx="240" ry="210" fill="url(#glow)"/>

  <text x="34" y="112" class="name">Leon Wang</text>
  <text x="38" y="150" class="label">RESEARCH</text>
  <text x="36" y="188" class="area a1">Spatial Intelligence</text>
  <text x="36" y="188" class="area a2">Long-video Understanding &amp; Grounding</text>
  <text x="36" y="188" class="area a3">Embodied AI · next</text>
  <text x="36" y="188" class="area a4">Enterprise AI Agents</text>

  <!-- a strip of video frames; the bright window slides along it, as temporal grounding picks a moment -->
  <g>
    <rect class="frame" x="36" y="222" width="22" height="30" rx="3"/><rect class="frame" x="64" y="222" width="22" height="30" rx="3"/>
    <rect class="frame" x="92" y="222" width="22" height="30" rx="3"/><rect class="frame" x="120" y="222" width="22" height="30" rx="3"/>
    <rect class="frame" x="148" y="222" width="22" height="30" rx="3"/><rect class="frame" x="176" y="222" width="22" height="30" rx="3"/>
    <rect class="frame" x="204" y="222" width="22" height="30" rx="3"/><rect class="frame" x="232" y="222" width="22" height="30" rx="3"/>
    <rect class="frame" x="260" y="222" width="22" height="30" rx="3"/><rect class="frame" x="288" y="222" width="22" height="30" rx="3"/>
    <rect class="frame" x="316" y="222" width="22" height="30" rx="3"/><rect class="frame" x="344" y="222" width="22" height="30" rx="3"/>
    <rect class="frame" x="372" y="222" width="22" height="30" rx="3"/><rect class="frame" x="400" y="222" width="22" height="30" rx="3"/>
    <rect x="34" y="219" width="80" height="36" rx="5" fill="#b8ee91" fill-opacity=".14" stroke="#b8ee91" stroke-width="1.5">
      <animate attributeName="x" values="34;258;146;342;34" keyTimes="0;.3;.5;.8;1" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </rect>
  </g>
  <text x="36" y="290" class="link">leon1111-wgl.github.io  ↗</text>

  <!-- orbits around a centre: space seen from more than one angle -->
  <circle cx="665" cy="159" r="86" fill="none" stroke="#2f4a55"/>
  <g class="spin">
    <circle cx="665" cy="159" r="61" fill="none" stroke="#527e86" stroke-dasharray="3 9"/>
    <ellipse cx="665" cy="159" rx="118" ry="38" transform="rotate(38 665 159)" fill="none" stroke="#60c9ce" stroke-opacity=".55"/>
    <circle cx="757" cy="231" r="4.5" fill="#60c9ce"/>
    <circle cx="573" cy="87" r="4.5" fill="#60c9ce" fill-opacity=".6"/>
  </g>
  <g class="spin-rev">
    <ellipse cx="665" cy="159" rx="122" ry="45" transform="rotate(-35 665 159)" fill="none" stroke="#527e86"/>
    <path d="M611 89L751 181L606 219Z M751 181L665 159L611 89" fill="none" stroke="#527e86" stroke-opacity=".7"/>
    <circle cx="611" cy="89" r="5" fill="#b8ee91"/><circle cx="751" cy="181" r="5" fill="#b8ee91"/><circle cx="606" cy="219" r="5" fill="#b8ee91"/>
  </g>
  <circle class="pulse" cx="665" cy="159" r="46" fill="none" stroke="#b8ee91"/>
  <circle cx="665" cy="159" r="35" fill="#101d29" stroke="#b8ee91"/>
  <text x="665" y="170" text-anchor="middle" fill="#f2f6fb" font-family="monospace" font-size="31">LW</text>
</g>
</svg>
