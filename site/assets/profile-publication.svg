<text x="36" y="40" class="label">ACADEMIC CONFERENCE</text>
<rect x="276" y="25" width="86" height="22" rx="11" fill="#b8ee91"/><text x="319" y="40" text-anchor="middle" class="badge" fill="#152214">AAAI 2026</text>
<text x="36" y="80" class="title">Seeing Is Believing: Grounding Long-Video Understanding</text>
<text x="36" y="106" class="title">in Spatio-Temporal Visual Evidence</text>
<text x="36" y="132" class="zh">以时空视觉证据支撑长视频推理 · 数据层面 + 模型层面</text>

<text x="36" y="164" class="tag">01 · DATA</text>
<text x="36" y="186" class="h">EV²-Bench</text><text x="136" y="186" class="d">answers must cite timestamps and spatial evidence</text>
<text x="36" y="214" class="num">1,000</text><text x="36" y="230" class="cap">long videos</text>
<text x="118" y="214" class="num">&gt; 30 min</text><text x="118" y="230" class="cap">each video</text>
<text x="222" y="214" class="num">≈ 43 min</text><text x="222" y="230" class="cap">on average</text>
<text x="326" y="214" class="num">2 levels</text><text x="326" y="230" class="cap">intra- and inter-event reasoning</text>

<text x="36" y="262" class="tag">02 · MODEL</text>
<text x="36" y="284" class="h">DynamicSelect</text><text x="168" y="284" class="d">question-guided dynamic token selection</text>
<text x="36" y="312" class="num">up to +1.9</text><text x="146" y="312" class="cap">over base models on VideoMME · MLVU · LongVideoBench · LVBench</text>

