<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="t">
<title id="t">Academic conference paper, AAAI 2026: Seeing Is Believing: Grounding Long-Video Understanding in Spatio-Temporal Visual Evidence. Data: EV²-Bench, a long-video reasoning benchmark whose answers must cite timestamps and spatial evidence; 1,000 videos over 30 minutes, about 43 minutes on average; intra-event and inter-event reasoning. Model: DynamicSelect, question-guided dynamic token selection, up to +1.9 over its base models on VideoMME, MLVU, LongVideoBench and LVBench. My part: benchmark construction, evidence annotation, model evaluation, evidence scoring with temporal IoU and bipartite matching.</title>
<style>
  .label { font: 700 13px Arial, sans-serif; fill: #60c9ce; letter-spacing: 3px; }
  .badge { font: 700 12px Arial, sans-serif; letter-spacing: .5px; }
  .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #f2f6fb; letter-spacing: -.3px; }
  .zh { font: 13.5px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif; fill: #8aa0b4; }
  .tag { font: 11px monospace; fill: #60c9ce; letter-spacing: 1px; }
  .h { font: 700 18px Arial, sans-serif; fill: #f2f6fb; }
  .d { font: 13px Arial, sans-serif; fill: #c4d0dc; }
  .num { font: 700 19px Arial, sans-serif; fill: #b8ee91; }
  .cap { font: 11.5px Arial, sans-serif; fill: #8aa0b4; }
  .chip { font: 12px Arial, sans-serif; fill: #c4d0dc; }
  .tiny { font: 10.5px monospace; fill: #527e86; letter-spacing: .5px; }
  .head { animation: play 6s linear infinite; }
  @keyframes play { from { transform: translateX(0); } to { transform: translateX(230px); } }
  .sel { opacity: 0; animation: pick 9s infinite; }
  .q2 { animation-delay: 3s; } .q3 { animation-delay: 6s; }
  @keyframes pick { 0%, 2% { opacity: 0; } 8%, 28% { opacity: 1; } 34%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .head, .sel { animation: none; } .q1 { opacity: 1; } }
</style>
