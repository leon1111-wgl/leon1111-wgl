<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="846" viewBox="0 0 1040 846" role="img" aria-labelledby="title"><title id="title">Guoliang — 有界文件统计流水线</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect width="1040" height="846" rx="20" fill="#101925"/><path d="M90 156V771" stroke="#497a83" stroke-width="3"/><text x="40" y="38" fill="#abdca0" font-size="17" letter-spacing="2">GUOLIANG / comp2017-thread-pipeline / LEARNING ROUTE</text><text x="40" y="78" fill="#f0f4fa" font-size="28" font-weight="600">有界文件统计流水线</text><rect x="125" y="110" width="865" height="112" rx="12" fill="#172536" stroke="#385466"/><circle cx="90" cy="162" r="24" fill="#abdca0"/><text x="90" y="169" fill="#14231c" text-anchor="middle" font-size="20" font-weight="700">01</text><text x="150" y="143" fill="#f0f4fa" font-size="23">1. 先精确定义一个文件的答案</text><text x="150" y="205" fill="#b7c9dc" font-size="18">构建 · 解释 · 检查</text><rect x="125" y="250" width="865" height="112" rx="12" fill="#172536" stroke="#385466"/><circle cx="90" cy="302" r="24" fill="#abdca0"/><text x="90" y="309" fill="#14231c" text-anchor="middle" font-size="20" font-weight="700">02</text><text x="150" y="283" fill="#f0f4fa" font-size="23">2. 用有界队列代替不断增长的列表</text><text x="150" y="345" fill="#b7c9dc" font-size="18">构建 · 解释 · 检查</text><rect x="125" y="390" width="865" height="112" rx="12" fill="#172536" stroke="#385466"/><circle cx="90" cy="442" r="24" fill="#abdca0"/><text x="90" y="449" fill="#14231c" text-anchor="middle" font-size="20" font-weight="700">03</text><text x="150" y="423" fill="#f0f4fa" font-size="23">3. 给每个任务唯一写入者</text><text x="150" y="485" fill="#b7c9dc" font-size="18">构建 · 解释 · 检查</text><rect x="125" y="530" width="865" height="112" rx="12" fill="#172536" stroke="#385466"/><circle cx="90" cy="582" r="24" fill="#abdca0"/><text x="90" y="589" fill="#14231c" text-anchor="middle" font-size="20" font-weight="700">04</text><text x="150" y="563" fill="#f0f4fa" font-size="23">4. 结束时不丢弃已入队任务</text><text x="150" y="625" fill="#b7c9dc" font-size="18">构建 · 解释 · 检查</text><rect x="125" y="670" width="865" height="112" rx="12" fill="#172536" stroke="#385466"/><circle cx="90" cy="722" r="24" fill="#abdca0"/><text x="90" y="729" fill="#14231c" text-anchor="middle" font-size="20" font-weight="700">05</text><text x="150" y="703" fill="#f0f4fa" font-size="23">5. 同时检验失败路径与正常路径</text><text x="150" y="765" fill="#b7c9dc" font-size="18">构建 · 解释 · 检查</text></g></svg>